name: Capygotchi prüfen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v5
      - name: Spiellogik und PWA-Dateien prüfen
        run: node --test tests/*.test.mjs
